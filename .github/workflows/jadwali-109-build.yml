name: Build Jadwali 1.0.9
run-name: Build Jadwali 1.0.9 APK

on:
  pull_request:
    branches: [main]
    paths:
      - 'jadwali109/trigger.txt'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Restore 1.0.8 source and apply 1.0.9 patch
        shell: bash
        run: |
          set -euo pipefail
          cat jadwali-build/source_ci_* > /tmp/source.b64
          base64 -d /tmp/source.b64 > /tmp/source.tar.xz
          echo 'ad66aea1012cf812834055ff66b459cacef508ab8ab281ad3f1ae2147aeca9f0  /tmp/source.tar.xz' | sha256sum -c -
          mkdir -p /tmp/project
          tar -xJf /tmp/source.tar.xz -C /tmp/project --strip-components=1
          base64 -d jadwali-build/v108.patch.xz.b64 | xz -d > /tmp/v108.patch
          cd /tmp/project
          patch -p1 < /tmp/v108.patch
          base64 -d "$GITHUB_WORKSPACE/jadwali109/v109.patch.xz.b64" | xz -d > /tmp/v109.patch
          echo '23af96f10ccec0d5508ae267d3434ceece405539af493226f65fbf6dcae5c147  /tmp/v109.patch' | sha256sum -c -
          patch -p1 < /tmp/v109.patch
          grep -q "applicationId 'com.aborayan.jadwali'" app/build.gradle
          grep -q "versionCode 10" app/build.gradle
          grep -q "versionName '1.0.9'" app/build.gradle
          grep -q 'وضع الحصة المباشر' app/src/main/java/com/aborayan/jadwali/MainActivity.kt
          grep -q 'إجازات بالتاريخ' app/src/main/java/com/aborayan/jadwali/MainActivity.kt
          grep -q 'endReminderMinutes' app/src/main/java/com/aborayan/jadwali/ScheduleRepository.kt
          grep -q 'widget_live_progress' app/src/main/res/layout/widget_timetable.xml
          grep -q 'nextLessonOccurrence' app/src/main/java/com/aborayan/jadwali/ScheduleRepository.kt
      - name: Android SDK
        shell: bash
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - name: Build release
        working-directory: /tmp/project
        run: gradle --no-daemon --stacktrace :app:assembleRelease
      - name: Sign and verify APK
        shell: bash
        run: |
          set -euo pipefail
          ROOT=/tmp/project
          BT="$ANDROID_HOME/build-tools/35.0.0"
          OUT=/tmp/Jadwali-v1.0.9.apk
          "$BT/zipalign" -f -p 4 "$ROOT/app/build/outputs/apk/release/app-release-unsigned.apk" /tmp/aligned.apk
          "$BT/apksigner" sign --ks "$ROOT/scripts/debug.keystore" --ks-pass pass:android --key-pass pass:android --out "$OUT" /tmp/aligned.apk
          "$BT/apksigner" verify --verbose --print-certs "$OUT" > /tmp/signing.txt
          "$BT/aapt2" dump badging "$OUT" > /tmp/badging.txt
          grep -q "package: name='com.aborayan.jadwali' versionCode='10' versionName='1.0.9'" /tmp/badging.txt
          grep -q 'Signer #1 certificate SHA-256 digest: b604b6d8ad14419f810bd7417fb0f417133c92fa3702492c43e84698e4ac564f' /tmp/signing.txt
          unzip -t "$OUT" >/dev/null
          sha256sum "$OUT" | tee /tmp/SHA256.txt
          stat -c%s "$OUT" | tee /tmp/SIZE.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Jadwali-v1.0.9
          path: /tmp/Jadwali-v1.0.9.apk
          retention-days: 1
      - name: Publish temporary release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG='jadwali-v1.0.9-temp'
          gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag 2>/dev/null || true
          SHA=$(cut -d' ' -f1 /tmp/SHA256.txt)
          gh release create "$TAG" /tmp/Jadwali-v1.0.9.apk --repo "$GITHUB_REPOSITORY" --title 'Jadwali v1.0.9' --notes "Verified APK. SHA-256: $SHA" --prerelease
          echo "DOWNLOAD_URL=https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/Jadwali-v1.0.9.apk"
