name: Jadwali PR APK transport
run-name: Build Jadwali 1.0.7 PR transport

on:
  pull_request:
    branches: [main]
    paths:
      - 'jadwali-build/trigger-pr.txt'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Restore source
        shell: bash
        run: |
          set -euo pipefail
          cat jadwali-build/source_ci_* > /tmp/source.b64
          base64 -d /tmp/source.b64 > /tmp/source.tar.xz
          echo 'ad66aea1012cf812834055ff66b459cacef508ab8ab281ad3f1ae2147aeca9f0  /tmp/source.tar.xz' | sha256sum -c -
          mkdir -p /tmp/project
          tar -xJf /tmp/source.tar.xz -C /tmp/project --strip-components=1
          grep -q "versionName '1.0.7'" /tmp/project/app/build.gradle
          grep -q 'android:width="30dp"' /tmp/project/app/src/main/res/drawable/ic_nav_today.xml
          grep -q 'android:width="30dp"' /tmp/project/app/src/main/res/drawable/ic_nav_week.xml
          grep -q 'android:width="30dp"' /tmp/project/app/src/main/res/drawable/ic_nav_settings.xml
      - name: Android SDK
        shell: bash
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - name: Build
        working-directory: /tmp/project
        run: gradle --no-daemon --stacktrace :app:assembleRelease
      - name: Sign verify and publish transport chunks
        shell: bash
        run: |
          set -euo pipefail
          ROOT=/tmp/project
          BT="$ANDROID_HOME/build-tools/35.0.0"
          OUT=/tmp/out
          mkdir -p "$OUT"
          "$BT/zipalign" -f -p 4 "$ROOT/app/build/outputs/apk/release/app-release-unsigned.apk" "$OUT/aligned.apk"
          "$BT/apksigner" sign --ks "$ROOT/scripts/debug.keystore" --ks-pass pass:android --key-pass pass:android --out "$OUT/Jadwali-v1.0.7.apk" "$OUT/aligned.apk"
          "$BT/apksigner" verify --verbose --print-certs "$OUT/Jadwali-v1.0.7.apk" > "$OUT/signing.txt"
          "$BT/aapt2" dump badging "$OUT/Jadwali-v1.0.7.apk" > "$OUT/badging.txt"
          grep -q "package: name='com.aborayan.jadwali' versionCode='8' versionName='1.0.7'" "$OUT/badging.txt"
          grep -q 'Signer #1 certificate SHA-256 digest: b604b6d8ad14419f810bd7417fb0f417133c92fa3702492c43e84698e4ac564f' "$OUT/signing.txt"
          SHA=$(sha256sum "$OUT/Jadwali-v1.0.7.apk" | awk '{print $1}')
          SIZE=$(stat -c%s "$OUT/Jadwali-v1.0.7.apk")
          HEAD_BRANCH='${{ github.event.pull_request.head.ref }}'
          git fetch origin "$HEAD_BRANCH"
          git checkout -B "$HEAD_BRANCH" "origin/$HEAD_BRANCH"
          rm -rf jadwali-result
          mkdir -p jadwali-result
          base64 -w0 "$OUT/Jadwali-v1.0.7.apk" | split -b 48000 -d -a 2 - jadwali-result/part_
          printf '%s\n' "$SHA" > jadwali-result/SHA256.txt
          printf '%s\n' "$SIZE" > jadwali-result/SIZE.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add jadwali-result
          git commit -m 'Publish temporary Jadwali 1.0.7 APK transport'
          git push origin HEAD:"$HEAD_BRANCH"
          echo "APK_SHA256=$SHA"
          echo "APK_SIZE=$SIZE"
