name: SchoolBell v2.2.9 Payload Build

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'jobs/schoolbell-v229/READY'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure payload complete
        shell: bash
        run: |
          set -euo pipefail
          test -f jobs/schoolbell-v229/READY
          test "$(find jobs/schoolbell-v229/project -name 'part-*.b64' | wc -l)" = "21"

      - name: Restore source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work/source
          cat jobs/schoolbell-v229/project/part-*.b64 > work/project.b64
          base64 -d work/project.b64 > work/project.zip
          echo "20a71a1cfe728cea8b4af4470494064d1b15356d34d6cf2b76ca868d2adc2380  work/project.zip" | sha256sum -c -
          unzip -t work/project.zip >/dev/null
          unzip -q work/project.zip -d work/source
          test -f work/source/SchoolBellJava/settings.gradle
          test -f work/source/SchoolBellJava/app/build.gradle

      - name: Restore Cairo fonts and bell sound
        shell: bash
        run: |
          set -euo pipefail
          ROOT=work/source/SchoolBellJava/app/src/main/res
          mkdir -p "$ROOT/font" "$ROOT/raw"
          curl -fL --retry 3 -o "$ROOT/font/cairo_400.ttf" 'https://raw.githubusercontent.com/emadomedher/google-fonts-arabic/master/lib/fonts/Cairo/Cairo-Regular.ttf'
          curl -fL --retry 3 -o "$ROOT/font/cairo_700.ttf" 'https://raw.githubusercontent.com/emadomedher/google-fonts-arabic/master/lib/fonts/Cairo/Cairo-Bold.ttf'
          python3 - "$ROOT/raw/school_bell.wav" <<'PY'
          import math, struct, sys, wave
          out=sys.argv[1]
          rate=22050
          dur=1.6
          n=int(rate*dur)
          with wave.open(out,'wb') as w:
              w.setnchannels(1); w.setsampwidth(2); w.setframerate(rate)
              frames=[]
              for i in range(n):
                  t=i/rate
                  env=math.exp(-2.6*t)
                  x=(math.sin(2*math.pi*880*t)+0.55*math.sin(2*math.pi*1320*t)+0.25*math.sin(2*math.pi*1760*t))*env
                  x=max(-1,min(1,x*0.45))
                  frames.append(struct.pack('<h',int(x*32767)))
              w.writeframes(b''.join(frames))
          PY
          test -s "$ROOT/font/cairo_400.ttf"
          test -s "$ROOT/font/cairo_700.ttf"
          test -s "$ROOT/raw/school_bell.wav"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Validate source
        shell: bash
        run: |
          set -euo pipefail
          cd work/source/SchoolBellJava
          python3 tools/validate_project.py
          grep -q 'versionCode 19' app/build.gradle
          grep -q 'versionName "2.2.9"' app/build.gradle

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          cd work/source/SchoolBellJava
          gradle --no-daemon --console=plain --stacktrace :app:assembleDebug

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK=work/source/SchoolBellJava/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          BT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}/build-tools/36.0.0"
          mkdir -p dist
          cp "$APK" dist/SchoolBell-v2.2.9-Card-Layout.apk
          "$BT/apksigner" verify --verbose --print-certs dist/SchoolBell-v2.2.9-Card-Layout.apk | tee dist/verification.txt
          "$BT/zipalign" -c -p 4 dist/SchoolBell-v2.2.9-Card-Layout.apk
          "$BT/aapt" dump badging dist/SchoolBell-v2.2.9-Card-Layout.apk | tee dist/apk-info.txt
          grep -q "package: name='com.aboryan.schoolbell'" dist/apk-info.txt
          grep -q "versionCode='19'" dist/apk-info.txt
          grep -q "versionName='2.2.9'" dist/apk-info.txt
          grep -q "targetSdkVersion:'36'" dist/apk-info.txt
          sha256sum dist/SchoolBell-v2.2.9-Card-Layout.apk > dist/SHA256SUMS.txt

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SchoolBell-v2.2.9
          path: dist/*
          if-no-files-found: error
          retention-days: 7
