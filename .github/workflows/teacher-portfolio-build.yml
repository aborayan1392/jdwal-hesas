name: Build Teacher Portfolio APK
on:
  push:
    branches: ['agent/teacher-portfolio-build']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Restore v1.3.1 source
        shell: bash
        run: |
          set -euo pipefail
          base64 -d teacher-portfolio-v1.3.1-source.b64 > teacher-portfolio-source.tar.xz
          echo '67d22c92d0c31a3f63b7ba90ee54f88bd6ff87af9c3bdb8f234414b12bfa71a6  teacher-portfolio-source.tar.xz' | sha256sum -c -
          mkdir teacher_portfolio
          tar -xJf teacher-portfolio-source.tar.xz -C teacher_portfolio
          cd teacher_portfolio
          grep -q 'versionName = "1.3.1"' app/build.gradle.kts
          grep -q 'window.decorView.layoutDirection=View.LAYOUT_DIRECTION_RTL' app/src/main/java/com/aborayan/teacherportfolio/MainActivity.kt
          grep -q 'numberedNavItem' app/src/main/java/com/aborayan/teacherportfolio/MainActivity.kt
          grep -q 'val x = if (col == 0) W - M - colW else M' app/src/main/java/com/aborayan/teacherportfolio/PdfExporter.kt
          grep -q 'val left = if (col == 0) W - M - cardW else M' app/src/main/java/com/aborayan/teacherportfolio/PdfExporter.kt
          grep -q 'TextDirectionHeuristics.FIRSTSTRONG_RTL' app/src/main/java/com/aborayan/teacherportfolio/PdfExporter.kt
          ! grep -q 'Gravity.RIGHT' app/src/main/java/com/aborayan/teacherportfolio/MainActivity.kt
          ! grep -q 'Gravity.LEFT' app/src/main/java/com/aborayan/teacherportfolio/MainActivity.kt
      - name: Install Arabic fonts
        shell: bash
        run: |
          set -euo pipefail
          F=teacher_portfolio/app/src/main/res/font
          mkdir -p "$F"
          curl -L --fail --retry 3 'https://raw.githubusercontent.com/google/fonts/main/ofl/cairo/Cairo%5Bslnt,wght%5D.ttf' -o "$F/cairo.ttf"
          curl -L --fail --retry 3 'https://raw.githubusercontent.com/google/fonts/main/ofl/tajawal/Tajawal-Regular.ttf' -o "$F/tajawal.ttf"
          curl -L --fail --retry 3 'https://raw.githubusercontent.com/google/fonts/main/ofl/notokufiarabic/NotoKufiArabic%5Bwght%5D.ttf' -o "$F/notokufi.ttf"
          curl -L --fail --retry 3 'https://raw.githubusercontent.com/google/fonts/main/ofl/amiri/Amiri-Regular.ttf' -o "$F/amiri.ttf"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android platform
        run: yes | sdkmanager 'platforms;android-35' 'build-tools;35.0.0' >/dev/null
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compile and lint
        working-directory: teacher_portfolio
        run: gradle --no-daemon lintDebug assembleDebug
      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK=teacher_portfolio/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -tq "$APK"
          $ANDROID_HOME/build-tools/35.0.0/apksigner verify --verbose "$APK"
          mkdir -p dist
          cp "$APK" dist/TeacherPortfolio-v1.3.1.apk
          sha256sum dist/TeacherPortfolio-v1.3.1.apk > dist/TeacherPortfolio-v1.3.1.apk.sha256
          tar --exclude='./app/src/main/res/font/*' -cJf dist/TeacherPortfolio-v1.3.1-source.tar.xz -C teacher_portfolio .
      - uses: actions/upload-artifact@v4
        with:
          name: teacher-portfolio-v1.3.1
          path: dist/*
          if-no-files-found: error
          retention-days: 7
