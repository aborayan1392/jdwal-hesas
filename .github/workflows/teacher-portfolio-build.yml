name: Build Teacher Portfolio APK
on:
  push:
    branches: ['agent/teacher-portfolio-build']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Restore v1.3.3 source
        shell: bash
        run: |
          set -euo pipefail
          cat teacher-portfolio-v1.2.1-chunks/chunk_00 \
              teacher-portfolio-v1.2.1-chunks/chunk_01 \
              teacher-portfolio-v1.2.1-chunks/chunk_02 \
              teacher-portfolio-v1.2.1-chunks/chunk_03 \
              teacher-portfolio-v1.2.1-chunks/chunk_04 > /tmp/source.b64
          base64 -d /tmp/source.b64 > teacher-portfolio-source.tar.xz
          echo '4bb2c0fb7878917f5f3b2884396be405eff22a8112835a657b907bf05056cbe5  teacher-portfolio-source.tar.xz' | sha256sum -c -
          mkdir teacher_portfolio
          tar -xJf teacher-portfolio-source.tar.xz -C teacher_portfolio
          cd teacher_portfolio
          patch -p1 < ../teacher-portfolio-overrides/v1.2.2.patch
          patch -p1 < ../teacher-portfolio-overrides/v1.2.3.patch
          patch -p1 < ../teacher-portfolio-overrides/v1.2.4.patch
          cat ../teacher-portfolio-overrides/v1.3.0-parts/part_00 \
              ../teacher-portfolio-overrides/v1.3.0-parts/part_01 \
              ../teacher-portfolio-overrides/v1.3.0-parts/part_02 \
              ../teacher-portfolio-overrides/v1.3.0-parts/part_03 \
              ../teacher-portfolio-overrides/v1.3.0-parts/part_04a \
              ../teacher-portfolio-overrides/v1.3.0-parts/part_04b \
              ../teacher-portfolio-overrides/v1.3.0-parts/part_04c \
              ../teacher-portfolio-overrides/v1.3.0-parts/part_04d \
              ../teacher-portfolio-overrides/v1.3.0-parts/part_05 > /tmp/v1.3.0.patch.b64
          base64 -d /tmp/v1.3.0.patch.b64 > /tmp/v1.3.0.patch
          echo '523144ea2abc81b609c7f5c8148752f8b7ac0a96d9b473aeb589d55d8f16a9e9  /tmp/v1.3.0.patch' | sha256sum -c -
          patch -p1 < /tmp/v1.3.0.patch
          cat ../teacher-portfolio-overrides/v1.3.1-lines/chunk_00 \
              ../teacher-portfolio-overrides/v1.3.1-lines/chunk_01 \
              ../teacher-portfolio-overrides/v1.3.1-lines/chunk_02 \
              ../teacher-portfolio-overrides/v1.3.1-lines/chunk_03 \
              ../teacher-portfolio-overrides/v1.3.1-lines/chunk_04 \
              ../teacher-portfolio-overrides/v1.3.1-lines/chunk_05 \
              ../teacher-portfolio-overrides/v1.3.1-lines/chunk_06 \
              ../teacher-portfolio-overrides/v1.3.1-lines/chunk_07 \
              ../teacher-portfolio-overrides/v1.3.1-lines/chunk_08 \
              ../teacher-portfolio-overrides/v1.3.1-lines/chunk_09 > /tmp/v1.3.1.patch
          echo '082fd04c6ee56d34177571ead4eeebc54473cb6354e0b6394da9190c13ed7265  /tmp/v1.3.1.patch' | sha256sum -c -
          patch -p1 < /tmp/v1.3.1.patch
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/src/main/java/com/aborayan/teacherportfolio/MainActivity.kt')
          s=p.read_text()
          s=s.replace('gravity=Gravity.END or Gravity.CENTER_VERTICAL; setPadding', 'gravity=Gravity.START or Gravity.CENTER_VERTICAL; textAlignment=View.TEXT_ALIGNMENT_VIEW_START; setPadding')
          s=s.replace('gravity=Gravity.END or Gravity.TOP; layoutDirection', 'gravity=Gravity.START or Gravity.TOP; textAlignment=View.TEXT_ALIGNMENT_VIEW_START; layoutDirection')
          s=s.replace('gravity=Gravity.END or Gravity.CENTER_VERTICAL\n        layoutDirection', 'gravity=Gravity.START or Gravity.CENTER_VERTICAL; textAlignment=View.TEXT_ALIGNMENT_VIEW_START\n        layoutDirection')
          s=s.replace('gravity=Gravity.END or Gravity.CENTER_VERTICAL;maxLines=2', 'gravity=Gravity.START or Gravity.CENTER_VERTICAL;textAlignment=View.TEXT_ALIGNMENT_VIEW_START;maxLines=2')
          s=s.replace('setTextColor(ink);gravity=Gravity.END or Gravity.CENTER_VERTICAL;textDirection', 'setTextColor(ink);gravity=Gravity.START or Gravity.CENTER_VERTICAL;textAlignment=View.TEXT_ALIGNMENT_VIEW_START;textDirection')
          s=s.replace('orientation=LinearLayout.VERTICAL;gravity=Gravity.END;addView', 'orientation=LinearLayout.VERTICAL;gravity=Gravity.START;layoutDirection=View.LAYOUT_DIRECTION_RTL;addView')
          s=s.replace('orientation=LinearLayout.VERTICAL;gravity=Gravity.END;layoutDirection', 'orientation=LinearLayout.VERTICAL;gravity=Gravity.START;layoutDirection')
          s=s.replace('gravity=Gravity.CENTER_VERTICAL or Gravity.END;background', 'gravity=Gravity.CENTER_VERTICAL or Gravity.START;textAlignment=View.TEXT_ALIGNMENT_VIEW_START;background')
          s=s.replace('gravity=Gravity.END or Gravity.CENTER_VERTICAL;textDirection=View.TEXT_DIRECTION_FIRST_STRONG_RTL', 'gravity=Gravity.START or Gravity.CENTER_VERTICAL;textAlignment=View.TEXT_ALIGNMENT_VIEW_START;textDirection=View.TEXT_DIRECTION_FIRST_STRONG_RTL')
          s=s.replace('gravity=Gravity.END or Gravity.CENTER_VERTICAL;maxLines=1', 'gravity=Gravity.START or Gravity.CENTER_VERTICAL;textAlignment=View.TEXT_ALIGNMENT_VIEW_START;maxLines=1')
          s=s.replace('this.text=text; textSize=size*textScale;', 'this.text=text; textSize=size*textScale; textAlignment=View.TEXT_ALIGNMENT_VIEW_START;')
          s=s.replace('val brand=LinearLayout(this).apply { orientation=LinearLayout.VERTICAL;', 'val brand=LinearLayout(this).apply { orientation=LinearLayout.VERTICAL; gravity=Gravity.START; layoutDirection=View.LAYOUT_DIRECTION_RTL;')
          s=s.replace('val p=db.getProfile(); val scroll=ScrollView(this); val box=LinearLayout(this).apply{orientation=LinearLayout.VERTICAL;setPadding', 'val p=db.getProfile(); val scroll=ScrollView(this).apply{layoutDirection=View.LAYOUT_DIRECTION_RTL}; val box=LinearLayout(this).apply{orientation=LinearLayout.VERTICAL;layoutDirection=View.LAYOUT_DIRECTION_RTL;setPadding')
          s=s.replace('val cover=LinearLayout(this).apply{orientation=if(isTablet)LinearLayout.HORIZONTAL else LinearLayout.VERTICAL;gravity=Gravity.CENTER;', 'val cover=LinearLayout(this).apply{orientation=if(isTablet)LinearLayout.HORIZONTAL else LinearLayout.VERTICAL;gravity=Gravity.CENTER;layoutDirection=View.LAYOUT_DIRECTION_RTL;')
          old='fun statCard(label:String,n:Int)=LinearLayout(this).apply{orientation=LinearLayout.VERTICAL;gravity=Gravity.CENTER;background=bg(Color.WHITE,12,line);setPadding(dp(8),dp(12),dp(8),dp(12));addView(tv(n.toString(),26f,goldDeep,true).apply{gravity=Gravity.CENTER});addView(tv(label,11f,muted).apply{gravity=Gravity.CENTER})}'
          new='''fun statCard(label:String,n:Int)=LinearLayout(this).apply{\n            orientation=LinearLayout.VERTICAL;gravity=Gravity.CENTER;background=bg(Color.WHITE,12,line);setPadding(dp(7),dp(7),dp(7),dp(7));layoutDirection=View.LAYOUT_DIRECTION_RTL\n            val number=tv(n.toString(),23f,goldDeep,true).apply{gravity=Gravity.CENTER;textAlignment=View.TEXT_ALIGNMENT_CENTER;includeFontPadding=false;maxLines=1}\n            val caption=tv(label,10.5f,muted,true).apply{gravity=Gravity.CENTER;textAlignment=View.TEXT_ALIGNMENT_CENTER;includeFontPadding=false;maxLines=2}\n            addView(number,LinearLayout.LayoutParams(LinearLayout.LayoutParams.MATCH_PARENT,0,0.56f))\n            addView(caption,LinearLayout.LayoutParams(LinearLayout.LayoutParams.MATCH_PARENT,0,0.44f))\n        }'''
          if old not in s: raise SystemExit('statCard pattern not found')
          s=s.replace(old,new)
          s=s.replace('fun addField(label:String,key:String,value:String,multi:Boolean=false){ val wrap=LinearLayout(this).apply{orientation=LinearLayout.VERTICAL;addView', 'fun addField(label:String,key:String,value:String,multi:Boolean=false){ val wrap=LinearLayout(this).apply{orientation=LinearLayout.VERTICAL;layoutDirection=View.LAYOUT_DIRECTION_RTL;addView')
          s=s.replace('textDirection=View.TEXT_DIRECTION_LTR;gravity=Gravity.CENTER_VERTICAL or Gravity.START}', 'layoutDirection=View.LAYOUT_DIRECTION_LTR;textDirection=View.TEXT_DIRECTION_LTR;gravity=Gravity.CENTER_VERTICAL or Gravity.START;textAlignment=View.TEXT_ALIGNMENT_VIEW_START}')
          p.write_text(s)
          bp=Path('app/build.gradle.kts')
          b=bp.read_text().replace('versionCode = 9','versionCode = 10').replace('versionName = "1.3.1"','versionName = "1.3.2"')
          bp.write_text(b)
          PY
          patch -p1 < ../teacher-portfolio-overrides/v1.3.3-centered-badges.patch
          grep -q 'versionName = "1.3.3"' app/build.gradle.kts
          grep -q 'private fun centeredBadge' app/src/main/java/com/aborayan/teacherportfolio/MainActivity.kt
          grep -q 'val y=height/2f - (fm.ascent+fm.descent)/2f' app/src/main/java/com/aborayan/teacherportfolio/MainActivity.kt
      - name: Install Arabic fonts
        shell: bash
        run: |
          set -euo pipefail
          F=teacher_portfolio/app/src/main/res/font
          mkdir -p "$F"
          curl -L --fail --retry 3 'https://raw.githubusercontent.com/google/fonts/main/ofl/cairo/Cairo%5Bslnt,wght%5D.ttf' -o "$F/cairo.ttf"
          curl -L --fail --retry 3 'https://raw.githubusercontent.com/google/fonts/main/ofl/tajawal/Tajawal-Regular.ttf' -o "$F/tajawal.ttf"
          curl -L --fail --retry 3 'https://raw.githubusercontent.com/google/fonts/main/ofl/notokufiarabic/NotoKufiArabic%5Bwght%5D.ttf' -o "$F/notokufi.ttf"
          curl -L --fail --retry 3 'https://raw.githubusercontent.com/google/fonts/main/ofl/amiri/Amiri-Regular.ttf' -o "$F/amiri.ttf"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android platform
        run: yes | sdkmanager 'platforms;android-35' 'build-tools;35.0.0' >/dev/null
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compile and lint
        working-directory: teacher_portfolio
        run: gradle --no-daemon lintDebug assembleDebug
      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK=teacher_portfolio/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -tq "$APK"
          $ANDROID_HOME/build-tools/35.0.0/apksigner verify --verbose "$APK"
          mkdir -p dist
          cp "$APK" dist/TeacherPortfolio-v1.3.3.apk
          sha256sum dist/TeacherPortfolio-v1.3.3.apk > dist/TeacherPortfolio-v1.3.3.apk.sha256
          tar --exclude='./app/src/main/res/font/*' -cJf dist/TeacherPortfolio-v1.3.3-source.tar.xz -C teacher_portfolio .
      - uses: actions/upload-artifact@v4
        with:
          name: teacher-portfolio-v1.3.3
          path: dist/*
          if-no-files-found: error
          retention-days: 7
