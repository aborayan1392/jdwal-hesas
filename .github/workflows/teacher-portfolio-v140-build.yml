name: Build Teacher Portfolio v1.4.1
on:
  push:
    branches: ['agent/teacher-portfolio-build']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Restore and verify v1.4.1 source
        shell: bash
        run: |
          set -euo pipefail
          cat teacher-portfolio-v141-source/chunk_00 \
              teacher-portfolio-v141-source/chunk_01 \
              teacher-portfolio-v141-source/chunk_02 \
              teacher-portfolio-v141-source/chunk_03 \
              teacher-portfolio-v141-source/chunk_04 \
              teacher-portfolio-v141-source/chunk_05 \
              teacher-portfolio-v141-source/chunk_06 \
              teacher-portfolio-v141-source/chunk_07 > /tmp/v141.b64
          test "$(wc -c < /tmp/v141.b64)" -eq 45488
          base64 -d /tmp/v141.b64 > /tmp/TeacherPortfolio-v1.4.1-source.tar.xz
          echo '0d4fcd5a5c56358b25c31a830d9c32461b20dd0435b0c02f8f9c189ec0bdccbb  /tmp/TeacherPortfolio-v1.4.1-source.tar.xz' | sha256sum -c -
          mkdir teacher_portfolio
          tar -xJf /tmp/TeacherPortfolio-v1.4.1-source.tar.xz -C teacher_portfolio
          grep -q 'versionName = "1.4.1"' teacher_portfolio/app/build.gradle.kts
          grep -q 'versionCode = 13' teacher_portfolio/app/build.gradle.kts
          grep -q 'إلغاء تحديد الكل' teacher_portfolio/app/src/main/java/com/aborayan/teacherportfolio/MainActivity.kt
          grep -q 'confirmDeleteSection' teacher_portfolio/app/src/main/java/com/aborayan/teacherportfolio/MainActivity.kt
          grep -q 'sectionStatusColor' teacher_portfolio/app/src/main/java/com/aborayan/teacherportfolio/MainActivity.kt
          grep -q 'اسحب للترتيب • حدّد حالة الإنجاز' teacher_portfolio/app/src/main/java/com/aborayan/teacherportfolio/MainActivity.kt
          grep -q '＋ شاهد' teacher_portfolio/app/src/main/java/com/aborayan/teacherportfolio/MainActivity.kt
          grep -q 'fold(0)' teacher_portfolio/app/src/main/java/com/aborayan/teacherportfolio/PortfolioDb.kt
      - name: Install Arabic fonts
        shell: bash
        run: |
          set -euo pipefail
          F=teacher_portfolio/app/src/main/res/font
          mkdir -p "$F"
          curl -L --fail --retry 3 'https://raw.githubusercontent.com/google/fonts/main/ofl/cairo/Cairo%5Bslnt,wght%5D.ttf' -o "$F/cairo.ttf"
          curl -L --fail --retry 3 'https://raw.githubusercontent.com/google/fonts/main/ofl/tajawal/Tajawal-Regular.ttf' -o "$F/tajawal.ttf"
          curl -L --fail --retry 3 'https://raw.githubusercontent.com/google/fonts/main/ofl/notokufiarabic/NotoKufiArabic%5Bwght%5D.ttf' -o "$F/notokufi.ttf"
          curl -L --fail --retry 3 'https://raw.githubusercontent.com/google/fonts/main/ofl/amiri/Amiri-Regular.ttf' -o "$F/amiri.ttf"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android platform
        run: yes | sdkmanager 'platforms;android-35' 'build-tools;35.0.0' >/dev/null
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compile and lint
        working-directory: teacher_portfolio
        run: gradle --no-daemon lintDebug assembleDebug
      - name: Verify v1.4.1 APK
        shell: bash
        run: |
          set -euo pipefail
          APK=teacher_portfolio/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -tq "$APK"
          $ANDROID_HOME/build-tools/35.0.0/apksigner verify --verbose "$APK"
          $ANDROID_HOME/build-tools/35.0.0/aapt dump badging "$APK" | tee /tmp/badging.txt
          grep -q "versionName='1.4.1'" /tmp/badging.txt
          grep -q "versionCode='13'" /tmp/badging.txt
          NEW_SHA=$(sha256sum "$APK" | awk '{print $1}')
          test "$NEW_SHA" != '0a5eb0f53051c91161b13fa489b9c8a6a65bcf3d44da60ff7fdeaa5a5010f77b'
          mkdir -p dist
          cp "$APK" dist/TeacherPortfolio-v1.4.1.apk
          sha256sum dist/TeacherPortfolio-v1.4.1.apk > dist/TeacherPortfolio-v1.4.1.apk.sha256
          tar --exclude='./app/src/main/res/font/*' -cJf dist/TeacherPortfolio-v1.4.1-source.tar.xz -C teacher_portfolio .
      - uses: actions/upload-artifact@v4
        with:
          name: teacher-portfolio-v1.4.1
          path: dist/*
          if-no-files-found: error
          retention-days: 7
