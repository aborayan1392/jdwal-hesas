name: Build Teacher Portfolio v1.4.0
on:
  push:
    branches: ['agent/teacher-portfolio-build']
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Restore v1.3.3 base
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/9270378458/zip" \
            -o /tmp/base-artifact.zip
          mkdir -p /tmp/base-artifact teacher_portfolio
          unzip -q /tmp/base-artifact.zip -d /tmp/base-artifact
          tar -xJf /tmp/base-artifact/TeacherPortfolio-v1.3.3-source.tar.xz -C teacher_portfolio
          grep -q 'versionName = "1.3.3"' teacher_portfolio/app/build.gradle.kts
      - name: Apply v1.4.0 upgrade
        shell: bash
        run: |
          set -euo pipefail
          cat teacher-portfolio-overrides/v1.4.0-parts/part_00 \
              teacher-portfolio-overrides/v1.4.0-parts/part_01 \
              teacher-portfolio-overrides/v1.4.0-parts/part_02 \
              teacher-portfolio-overrides/v1.4.0-parts/part_03 \
              teacher-portfolio-overrides/v1.4.0-parts/part_04 \
              teacher-portfolio-overrides/v1.4.0-parts/part_05 \
              teacher-portfolio-overrides/v1.4.0-parts/part_06 \
              teacher-portfolio-overrides/v1.4.0-parts/part_07 \
              teacher-portfolio-overrides/v1.4.0-parts/part_08 \
              teacher-portfolio-overrides/v1.4.0-parts/part_09 \
              teacher-portfolio-overrides/v1.4.0-parts/part_10 \
              teacher-portfolio-overrides/v1.4.0-parts/part_11 > /tmp/v1.4.0.patch.b64
          base64 -d /tmp/v1.4.0.patch.b64 > /tmp/v1.4.0.patch
          echo '7715c2e23dba25500c42acbc299957ba434d0a815cdc5a36e97855729be894b9  /tmp/v1.4.0.patch' | sha256sum -c -
          cd teacher_portfolio
          patch -p1 < /tmp/v1.4.0.patch
          grep -q 'versionName = "1.4.0"' app/build.gradle.kts
          grep -q 'CREATE TABLE attachments' app/src/main/java/com/aborayan/teacherportfolio/PortfolioDb.kt
          grep -q 'PdfRenderer' app/src/main/java/com/aborayan/teacherportfolio/MainActivity.kt
          grep -q 'completionPercent' app/src/main/java/com/aborayan/teacherportfolio/PortfolioDb.kt
          test -f app/src/main/java/com/aborayan/teacherportfolio/ZoomImageView.kt
      - name: Install Arabic fonts
        shell: bash
        run: |
          set -euo pipefail
          F=teacher_portfolio/app/src/main/res/font
          mkdir -p "$F"
          curl -L --fail --retry 3 'https://raw.githubusercontent.com/google/fonts/main/ofl/cairo/Cairo%5Bslnt,wght%5D.ttf' -o "$F/cairo.ttf"
          curl -L --fail --retry 3 'https://raw.githubusercontent.com/google/fonts/main/ofl/tajawal/Tajawal-Regular.ttf' -o "$F/tajawal.ttf"
          curl -L --fail --retry 3 'https://raw.githubusercontent.com/google/fonts/main/ofl/notokufiarabic/NotoKufiArabic%5Bwght%5D.ttf' -o "$F/notokufi.ttf"
          curl -L --fail --retry 3 'https://raw.githubusercontent.com/google/fonts/main/ofl/amiri/Amiri-Regular.ttf' -o "$F/amiri.ttf"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android platform
        run: yes | sdkmanager 'platforms;android-35' 'build-tools;35.0.0' >/dev/null
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compile and lint
        working-directory: teacher_portfolio
        run: gradle --no-daemon lintDebug assembleDebug
      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK=teacher_portfolio/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -tq "$APK"
          $ANDROID_HOME/build-tools/35.0.0/apksigner verify --verbose "$APK"
          mkdir -p dist
          cp "$APK" dist/TeacherPortfolio-v1.4.0.apk
          sha256sum dist/TeacherPortfolio-v1.4.0.apk > dist/TeacherPortfolio-v1.4.0.apk.sha256
          tar --exclude='./app/src/main/res/font/*' -cJf dist/TeacherPortfolio-v1.4.0-source.tar.xz -C teacher_portfolio .
      - uses: actions/upload-artifact@v4
        with:
          name: teacher-portfolio-v1.4.0
          path: dist/*
          if-no-files-found: error
          retention-days: 7
