name: Build Teacher Portfolio v1.4.0
on:
  push:
    branches: ['agent/teacher-portfolio-build']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Restore and repair v1.4.0 source
        shell: bash
        run: |
          set -euo pipefail
          cat teacher-portfolio-v140-source/chunk_00 \
              teacher-portfolio-v140-source/chunk_01 \
              teacher-portfolio-v140-source/chunk_02 \
              teacher-portfolio-v140-source/chunk_03 > /tmp/v140.b64
          test "$(wc -c < /tmp/v140.b64)" -eq 48000
          base64 -d /tmp/v140.b64 > /tmp/TeacherPortfolio-v1.4.0-source.tar.xz
          echo '9b610eb3207762ee4670878dd3217342d9af5250b8174195b6bb42b66e0de930  /tmp/TeacherPortfolio-v1.4.0-source.tar.xz' | sha256sum -c -
          mkdir teacher_portfolio
          tar -xJf /tmp/TeacherPortfolio-v1.4.0-source.tar.xz -C teacher_portfolio
          sed -i 's/? :/?:/g' teacher_portfolio/app/src/main/java/com/aborayan/teacherportfolio/MainActivity.kt
          sed -i 's/? :/?:/g' teacher_portfolio/app/src/main/java/com/aborayan/teacherportfolio/PortfolioDb.kt
          ! grep -R -F -q '? :' teacher_portfolio/app/src/main/java/com/aborayan/teacherportfolio
          grep -q 'versionName = "1.4.0"' teacher_portfolio/app/build.gradle.kts
          grep -q 'CREATE TABLE attachments' teacher_portfolio/app/src/main/java/com/aborayan/teacherportfolio/PortfolioDb.kt
          grep -q 'PdfRenderer' teacher_portfolio/app/src/main/java/com/aborayan/teacherportfolio/MainActivity.kt
          grep -q 'completionPercent' teacher_portfolio/app/src/main/java/com/aborayan/teacherportfolio/PortfolioDb.kt
          grep -q 'showEvidenceManageDialog' teacher_portfolio/app/src/main/java/com/aborayan/teacherportfolio/MainActivity.kt
          grep -q 'اختيار الأقسام للتصدير' teacher_portfolio/app/src/main/java/com/aborayan/teacherportfolio/MainActivity.kt
          grep -q 'مصمم الغلاف' teacher_portfolio/app/src/main/java/com/aborayan/teacherportfolio/MainActivity.kt
          test -f teacher_portfolio/app/src/main/java/com/aborayan/teacherportfolio/ZoomImageView.kt
      - name: Install Arabic fonts
        shell: bash
        run: |
          set -euo pipefail
          F=teacher_portfolio/app/src/main/res/font
          mkdir -p "$F"
          curl -L --fail --retry 3 'https://raw.githubusercontent.com/google/fonts/main/ofl/cairo/Cairo%5Bslnt,wght%5D.ttf' -o "$F/cairo.ttf"
          curl -L --fail --retry 3 'https://raw.githubusercontent.com/google/fonts/main/ofl/tajawal/Tajawal-Regular.ttf' -o "$F/tajawal.ttf"
          curl -L --fail --retry 3 'https://raw.githubusercontent.com/google/fonts/main/ofl/notokufiarabic/NotoKufiArabic%5Bwght%5D.ttf' -o "$F/notokufi.ttf"
          curl -L --fail --retry 3 'https://raw.githubusercontent.com/google/fonts/main/ofl/amiri/Amiri-Regular.ttf' -o "$F/amiri.ttf"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android platform
        run: yes | sdkmanager 'platforms;android-35' 'build-tools;35.0.0' >/dev/null
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compile and lint
        working-directory: teacher_portfolio
        run: gradle --no-daemon lintDebug assembleDebug
      - name: Verify real v1.4.0 APK
        shell: bash
        run: |
          set -euo pipefail
          APK=teacher_portfolio/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -tq "$APK"
          $ANDROID_HOME/build-tools/35.0.0/apksigner verify --verbose "$APK"
          $ANDROID_HOME/build-tools/35.0.0/aapt dump badging "$APK" | tee /tmp/badging.txt
          grep -q "versionName='1.4.0'" /tmp/badging.txt
          NEW_SHA=$(sha256sum "$APK" | awk '{print $1}')
          test "$NEW_SHA" != 'ef89604b5b2f76bc035b6a742737d308229835bd5b2a64b520d882b8605cb0a5'
          mkdir -p dist
          cp "$APK" dist/TeacherPortfolio-v1.4.0.apk
          sha256sum dist/TeacherPortfolio-v1.4.0.apk > dist/TeacherPortfolio-v1.4.0.apk.sha256
          tar --exclude='./app/src/main/res/font/*' -cJf dist/TeacherPortfolio-v1.4.0-source.tar.xz -C teacher_portfolio .
      - uses: actions/upload-artifact@v4
        with:
          name: teacher-portfolio-v1.4.0-real
          path: dist/*
          if-no-files-found: error
          retention-days: 7
